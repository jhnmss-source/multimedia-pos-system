<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen Order System</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            padding-top: 30px;
            margin: 0;
        }

        .container {
            background-color: white;
            width: 450px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 { font-size: 1.3rem; margin-bottom: 5px; }
        .menu-list { margin-bottom: 20px; font-size: 0.9rem; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .field { display: flex; flex-direction: column; gap: 4px; }
        
        label { font-weight: bold; font-size: 0.85rem; }

        select, input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: 0.2s;
        }

        #add-btn { background-color: #e9ecef; color: #333; border: 1px solid #ced4da; }
        #add-btn:hover { background-color: #dee2e6; }

        #pay-btn { background-color: #28a745; color: white; margin-top: 10px; }
        #pay-btn:hover { background-color: #218838; }

        .receipt {
            border-top: 2px solid #eee;
            margin-top: 20px;
            padding-top: 15px;
        }

        #order-summary { list-style: none; padding: 0; font-size: 0.95rem; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 5px; }

        .total-section { font-size: 1.1rem; margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
        .change-section { color: #d9534f; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to the canteen! Here are our street foods menu.</h1>
        <p>Prices are shown below. </p>
        
        <ul class="menu-list">
            <li>Burger - 60 pesos</li>
            <li>Fries - 50 pesos</li>
            <li>Fishbol - 20 pesos</li>
            <li>Kikiam - 25 pesos</li>
        </ul>

        <div class="form-group">
            <button id="add-btn">Add a food item</button>

            <div class="field">
                <label>Choice</label>
                <select id="food-choice">
                    <!-- Ensure value matches the keys in the JS object exactly -->
                    <option value="burger">burger</option>
                    <option value="fries">fries</option>
                    <option value="fishbol">fishbol</option>
                    <option value="kikiam">kikiam</option>
                </select>
            </div>

            <div class="field">
                <label>Quantity</label>
                <input type="number" id="quantity" value="1" min="1">
            </div>

            <div class="field">
                <label>Cash</label>
                <input type="number" id="cash-input" placeholder="Enter amount">
            </div>

            <button id="pay-btn">Pay!</button>
        </div>

        <div class="receipt">
            <h3>Your Receipt:</h3>
            <ul id="order-summary"></ul>
            <div class="total-section">
                <strong>Total: <span id="total-display">0</span> pesos</strong>
            </div>
            <div id="change-display" class="change-section"></div>
        </div>
    </div>

    <script>
        // JS Object for key-value pairs (using lowercase to match select values)
        const prices = {
            "burger": 60,
            "fries": 50,
            "fishbol": 20,
            "kikiam": 25
        };

        let currentTotal = 0;

        const addBtn = document.getElementById('add-btn');
        const payBtn = document.getElementById('pay-btn');
        const foodSelect = document.getElementById('food-choice');
        const qtyInput = document.getElementById('quantity');
        const cashInput = document.getElementById('cash-input');
        
        const orderSummary = document.getElementById('order-summary');
        const totalDisplay = document.getElementById('total-display');
        const changeDisplay = document.getElementById('change-display');

        addBtn.addEventListener('click', () => {
            const item = foodSelect.value;
            const qty = parseInt(qtyInput.value);

            // Safety check: ensure item exists in object to avoid NaN
            if (prices[item] !== undefined && qty > 0) {
                const price = prices[item];
                const cost = price * qty;
                
                currentTotal += cost;
                totalDisplay.textContent = currentTotal;

                // DOM Manipulation
                const li = document.createElement('li');
                li.className = 'summary-item';
                li.innerHTML = `<span>${item} (x${qty})</span> <span>${cost} pesos</span>`;
                orderSummary.appendChild(li);
                
                // Clear change if user adds more items
                changeDisplay.textContent = "";
            } else {
                alert("Please enter a valid quantity.");
            }
        });

        payBtn.addEventListener('click', () => {
            const cashProvided = parseFloat(cashInput.value);

            if (currentTotal === 0) {
                alert("Please add items to your order first.");
                return;
            }

            if (isNaN(cashProvided) || cashProvided < currentTotal) {
                alert("Insufficient cash or invalid input!");
            } else {
                const change = cashProvided - currentTotal;
                changeDisplay.textContent = `Change: ${change} pesos`;
                alert(`Transaction Complete! Your change is ${change} pesos.`);
            }
        });
    </script>
</body>
</html>
